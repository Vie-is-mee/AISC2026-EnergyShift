name: Backend data contract
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  input-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s backend/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check input-desk.js
      - run: node --check workspace.js
      - run: node --test ops/input-model.test.cjs
      - run: node --test ops/deployment.test.cjs
      - run: node --test ops/view-contract.test.cjs
