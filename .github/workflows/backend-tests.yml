name: Backend data contract
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  input-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s backend/tests -v
